[package]
name = "apiman"
version = "0.3.0"
edition = "2024"

[lib]
name = "apiman"
path = "src/lib.rs"

[[bin]]
name = "apiman"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive", "alloc"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
rpassword = "7.3"
arboard = "3.4"
libc = "0.2"
tempfile = "3.17"
uuid = { version = "1.13", features = ["v4"] }
